<!DOCTYPE html><html lang="zh"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1" />  <title>产品档案 · 小游戏榜单监控</title>  <link rel="preconnect" href="https://fonts.googleapis.com" />  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />  <link rel="stylesheet" href="style.css?v=17" />  <style>    .gp-head-row { display: flex; align-items: center; gap: 14px; }

    .gp-home-btn:hover { background: #e9eaed; color: #333; }    .gp-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px;      padding: 0 40px; }    @media (max-width: 720px) { .gp-toolbar { padding: 0 16px; } }    .gp-toolbar input[type="search"] { width: 260px; flex: 0 0 auto; margin-left: 2px; }    .gp-toolbar .gp-count { color: #888; font-size: 13px; }    /* 列表 */    .gp-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }    @media (max-width: 1400px) { .gp-list { grid-template-columns: repeat(4, 1fr); } }    @media (max-width: 1100px) { .gp-list { grid-template-columns: repeat(3, 1fr); } }    @media (max-width: 800px) { .gp-list { grid-template-columns: repeat(2, 1fr); } }    @media (max-width: 520px) { .gp-list { grid-template-columns: 1fr; } }    .gp-card {      display: flex; align-items: stretch; padding: 0; border: 2px solid var(--border, #ddd);      border-radius: 10px; cursor: pointer; background: var(--bg2, #fff); overflow: hidden;      position: relative; transform: rotate(-.6deg);      box-shadow: 6px 8px 0 -2px #f0f0f0, 6px 8px 0 0 rgba(0,0,0,.06),        0 3px 10px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);      transition: border-color .15s, box-shadow .15s, transform .15s;    }    .gp-card:hover { border-color: var(--brand, #2f6fed); box-shadow: 0 6px 18px rgba(0,0,0,.12), 0 2px 4px rgba(0,0,0,.05); transform: translateY(-2px) rotate(0deg); }    .gp-card.v-high:hover { border-color: #e11d48; box-shadow: 7px 9px 0 -2px #f2dada, 7px 9px 0 0 rgba(225,29,72,.12), 0 8px 22px rgba(225, 29, 72, .25), 0 2px 4px rgba(0,0,0,.05); }    .gp-card.v-mid:hover { border-color: #f59e0b; box-shadow: 7px 9px 0 -2px #f2e7c8, 7px 9px 0 0 rgba(245,158,11,.12), 0 8px 22px rgba(245, 158, 11, .22), 0 2px 4px rgba(0,0,0,.05); }    .gp-card.v-low:hover { border-color: #10b981; box-shadow: 7px 9px 0 -2px #d3ecdc, 7px 9px 0 0 rgba(16,185,129,.12), 0 8px 22px rgba(16, 185, 129, .2), 0 2px 4px rgba(0,0,0,.05); }    .gp-card-thumb { width: 90px; height: auto; align-self: stretch; flex-shrink: 0; object-fit: cover;      background: #f0f2f5; border-right: 1px solid var(--border, #eee); display: block; min-height: 120px; }    .gp-card-thumb.empty { display: flex; align-items: center; justify-content: center; color: #bbb; font-size: 12px; }    .gp-card-body { min-width: 0; flex: 1; padding: 10px 12px; }    .gp-card-name { font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 6px;      flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }    .gp-card-name .badge-has { font-size: 11px; background: var(--brand-tint, #eef4ff); color: var(--brand, #2f6fed);      padding: 1px 6px; border-radius: 4px; }    .gp-card-name .badge-no { font-size: 11px; background: #f5f5f5; color: #999;      padding: 1px 6px; border-radius: 4px; border: 1px dashed #d0d0d0; }    .gp-card-dev { font-size: 13px; color: #666; margin-bottom: 4px; }    .gp-card-tags { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px 0; }    .gp-card-tags .tag { font-size: 11px; background: #f0f2f5; padding: 1px 6px; border-radius: 4px; color: #555; }    .gp-card-desc { font-size: 13px; color: #888; overflow: hidden; display: -webkit-box;      -webkit-line-clamp: 2; -webkit-box-orient: vertical; }    .gp-card-meta { font-size: 11px; color: #aaa; padding: 3px 0 2px; }    .gp-card-abandon-reason { font-size: 11px; color: #c0392b; font-weight: 600; padding: 2px 0 8px; line-height: 1.4; }    .gp-empty { color: #999; padding: 30px 0; text-align: center; }    /* 编辑视图 */    .gp-form { max-width: none; width: 100%; box-sizing: border-box; }    .gp-form label { display: block; font-weight: 600; margin: 14px 0 6px; }    .gp-form input[type="text"], .gp-form textarea {      width: 100%; padding: 8px 10px; border: 1px solid var(--border, #ddd);      border-radius: 6px; font: inherit; background: var(--bg2, #fff); color: inherit;    }    .gp-form textarea { min-height: 90px; resize: vertical; }    .gp-card.v-high { background: #fff5f5; border-color: #e8a3a3; border-top: 4px solid #e11d48;      box-shadow: 6px 8px 0 -2px #f2dada, 6px 8px 0 0 rgba(225,29,72,.10),        0 3px 12px rgba(225, 29, 72, .18), 0 1px 2px rgba(0,0,0,.04); }    .gp-card.v-mid { background: #fffdf5; border-color: #e5c96f; border-top: 4px solid #f59e0b;      box-shadow: 6px 8px 0 -2px #f2e7c8, 6px 8px 0 0 rgba(245,158,11,.10),        0 3px 12px rgba(245, 158, 11, .16), 0 1px 2px rgba(0,0,0,.04); }    .gp-card.v-low { background: #f5fbf7; border-color: #9fd0b2; border-top: 4px solid #10b981;      box-shadow: 6px 8px 0 -2px #d3ecdc, 6px 8px 0 0 rgba(16,185,129,.10),        0 3px 12px rgba(16, 185, 129, .15), 0 1px 2px rgba(0,0,0,.04); }    .gp-card.v-abandoned { background: #fafafa; border-color: #d4d4d4; border-top: 4px solid #e5e7eb;      position: relative; overflow: hidden;      box-shadow: 6px 8px 0 -2px #f0f0f0, 6px 8px 0 0 rgba(0,0,0,.05); }    .gp-card.v-abandoned .gp-card-thumb { filter: grayscale(1) brightness(.96); opacity: .6; }    .gp-card.v-abandoned .gp-card-name { color: #888; text-decoration: line-through; }    .gp-card.v-abandoned .gp-card-dev,    .gp-card.v-abandoned .gp-card-pub,    .gp-card.v-abandoned .gp-card-desc,    .gp-card.v-abandoned .gp-card-meta,    .gp-card.v-abandoned .gp-card-src { color: #aaa; }    .gp-card.v-abandoned .gp-card-tags .tag { background: #e6e6e6; color: #999; }    .gp-card.v-abandoned .gp-card-name .badge-has {      background: var(--brand, #2f6fed); color: #fff;      text-decoration: none; border-radius: 4px; padding: 1px 6px;    }    .badge-board { font-size: 11px; background: #eef4ff; color: var(--brand, #2f6fed);      padding: 1px 6px; border-radius: 4px; margin-right: 4px; }    .badge-abandoned { font-size: 11px; font-weight: 600; background: #c0392b; color: #fff;      padding: 1px 6px; border-radius: 4px; margin-right: 4px; }    .gp-card-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }    .gp-card-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }    .gp-card-fav { flex-shrink: 0; font-size: 14px; padding: 0 4px; border: none;      background: transparent; color: #c0392b; cursor: pointer; line-height: 1.2; opacity: .4; }    .gp-card-fav:hover { opacity: .8; }    .gp-card-fav.on { opacity: 1; background: #fff0f0; }    .gp-card-val, .gp-card-ab { flex-shrink: 0; padding: 1px 8px; border-radius: 999px;      border: 1px solid transparent; cursor: pointer; font: inherit; font-size: 10px;      font-weight: 600; line-height: 1.7; }    .gp-card-val.high { background: #e11d48; border-color: #e11d48; color: #fff; box-shadow: 0 0 0 2px rgba(225, 29, 72, .18); }    .gp-card-val.mid { background: #f59e0b; border-color: #f59e0b; color: #fff; }    .gp-card-val.low { background: #10b981; border-color: #10b981; color: #fff; }    .gp-card-val.abandoned { background: #f3f4f6; border-color: #d1d5db; color: #9ca3af; }    .gp-val-menu { position: fixed; z-index: 3000; background: #fff; border: 1px solid #ddd;      border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.12); padding: 4px;      display: flex; flex-direction: column; min-width: 96px; }    .gp-val-menu-item { font: inherit; font-size: 12px; padding: 6px 10px; border: none; background: none;      text-align: left; cursor: pointer; border-radius: 4px; color: #444; }    .gp-val-menu-item:hover { background: #f0f2f5; }    .gp-val-menu-item.active { color: var(--brand, #2f6fed); font-weight: 600; }    .gp-card-ab:hover { border-color: var(--danger, #c0392b); color: var(--danger, #c0392b); background: #fff5f5; }    .gp-card-head .gp-card-name { margin-bottom: 0; }    .gp-card-src { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }    .badge-src { font-size: 11px; background: #f0f7ff; color: #2c6fbb; padding: 1px 6px;      border-radius: 4px; border: 1px solid #d6e6f7; }    .gp-card-pub { font-size: 11px; color: #888; padding: 3px 0; overflow: hidden;      text-overflow: ellipsis; white-space: nowrap; }    .gp-value-pick { display: flex; flex-wrap: wrap; gap: 10px; margin: 4px 0; }    .gp-value-pick label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-size: 14px; }    .gp-val { padding: 1px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }    .gp-val.high { background: #fde8e8; color: #c0392b; }    .gp-val.mid { background: #fef3c7; color: #b7791f; }    .gp-val.low { background: #e5f2e7; color: #3f7a4a; }    .gp-val.abandoned { background: #e8e8e8; color: #888; }    .gp-card-value { display: inline-block; margin-left: 4px; }    #gp-filter { margin-left: 8px; cursor: pointer; }    #gp-fav.active { background: #c0392b; color: #fff; border-color: #c0392b; }    .gp-abandon { background: #c0392b; color: #fff; }    .gp-unabandon { background: transparent; color: var(--brand, #2f6fed); border: 1px solid currentColor !important; }    .gp-abandon:hover, .gp-unabandon:hover { opacity: .85; }        .md-editor { margin-top: 10px; width: 100%; }    .md-editor textarea { width: 100%; min-height: 300px; resize: vertical; font-size: 14px; line-height: 1.7;      padding: 12px 14px; border: 1px solid var(--border, #ddd); border-radius: 6px; font: inherit;      background: var(--bg2, #fff); color: inherit; box-sizing: border-box; }    .md-editor .md-preview { width: 100%; box-sizing: border-box; }    .md-toolbar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 6px; }    .md-toolbar button { padding: 3px 9px; border: 1px solid var(--border, #ddd); border-radius: 4px;      background: var(--bg2, #fff); cursor: pointer; font: inherit; font-size: 13px; line-height: 1.4; color: inherit; }    .md-toolbar button:hover { border-color: var(--brand, #2f6fed); color: var(--brand, #2f6fed); }    .md-toolbar .md-spacer { flex: 1; }    .md-toolbar .md-tab { padding: 3px 12px; }    .md-toolbar .md-tab.active { background: var(--brand, #2f6fed); color: #fff; border-color: var(--brand, #2f6fed); }    .md-preview { border: 1px solid var(--border, #ddd); border-radius: 6px; padding: 10px 12px;      background: var(--bg2, #fff); min-height: 90px; font-size: 14px; }    .md-preview h1 { font-size: 1.4em; } .md-preview h2 { font-size: 1.25em; } .md-preview h3 { font-size: 1.1em; }    .md-preview p { margin: 6px 0; }    .md-preview ul, .md-preview ol { margin: 6px 0; padding-left: 1.4em; }    .md-preview code { background: #f0f2f5; padding: 1px 4px; border-radius: 4px; font-size: 13px; }    .md-preview pre { background: #f6f8fa; padding: 10px; border-radius: 6px; overflow-x: auto; }    .md-preview pre code { background: none; padding: 0; }    .md-preview blockquote { border-left: 3px solid var(--brand, #2f6fed); margin: 8px 0;      padding: 2px 12px; color: #666; background: var(--brand-tint, #eef4ff); border-radius: 0 4px 4px 0; }    .md-preview img { max-width: 100%; border-radius: 6px; }    .md-preview a { color: var(--brand, #2f6fed); }    .gp-view-fields dd p { margin: 4px 0; }    .gp-view-fields dd ul, .gp-view-fields dd ol { margin: 4px 0; padding-left: 1.3em; }    #gp-view-shots { display: flex; flex-wrap: wrap; gap: 10px; }    .gp-view-shot { flex: 0 0 calc(33.333% - 7px); width: calc(33.333% - 7px); height: auto;      border-radius: 6px; border: 1px solid var(--border, #ddd); display: block; }    .gp-shots { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }    .gp-shot { position: relative; width: 160px; }    .gp-shot img { width: 160px; height: 110px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border, #ddd); display: block; }    .gp-shot.is-del { opacity: .45; outline: 2px dashed var(--danger, #c0392b); }    .gp-shot.is-del img { filter: grayscale(1); }        .gp-shot .del { position: absolute; top: 4px; right: 4px; background: var(--danger, #c0392b); color: #fff;      border: none; border-radius: 50%; width: 22px; height: 22px; cursor: pointer; font-size: 14px; line-height: 1; }    .gp-upload { margin-top: 10px; }    .gp-upload input[type="file"] { margin-right: 10px; }    .gp-actions { margin-top: 18px; display: flex; gap: 10px; align-items: center; }    .gp-actions button { padding: 5px 12px; border: none; border-radius: 6px; cursor: pointer; font: inherit;      font-size: 13px; line-height: 1.5; }    .gp-back { background: #f3f4f6; color: #555; border: 1px solid #e5e7eb !important; }    .gp-back:hover { background: #e9eaed; color: #333; }    .gp-save { background: var(--brand, #2f6fed); color: #fff; }    .gp-save:disabled { opacity: .5; cursor: not-allowed; }    .gp-status { margin-top: 10px; font-size: 14px; color: #666; min-height: 20px; }    .gp-hint { color: #888; font-size: 13px; }    .gp-lightbox { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,.85);      display: flex; align-items: center; justify-content: center; cursor: zoom-out; }    .gp-lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,.5); }    .gp-view-fields { display: grid; grid-template-columns: 84px 1fr; gap: 10px 16px; margin: 16px 0 0; }    .gp-view-fields dt { color: #999; font-size: 13px; font-weight: 600; line-height: 1.6; padding-top: 1px; }    .gp-view-fields dd { margin: 0; font-size: 14px; line-height: 1.7; color: #444; word-break: break-word; }    .gp-view-fields dd p { margin: 4px 0; }    .gp-view-fields dd ul, .gp-view-fields dd ol { margin: 4px 0; padding-left: 1.3em; }    .gp-view-shots { cursor: zoom-in; }    .gp-view-shot { cursor: zoom-in; }    .gp-view-name-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }    .gp-board-tag { font-size: 12px; background: var(--brand-tint, #eef4ff); color: var(--brand, #2f6fed);      padding: 2px 8px; border-radius: 4px; font-weight: 500; white-space: nowrap; }    .gp-pager { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; }    .gp-pager button { padding: 4px 12px; border: 1px solid #e5e7eb; border-radius: 6px;      background: #fafafa; cursor: pointer; font: inherit; font-size: 12px; line-height: 1.6; color: #555; }    .gp-pager button:hover:not(:disabled) { border-color: var(--brand, #2f6fed); color: var(--brand, #2f6fed); background: #fff; }    .gp-pager button:disabled { opacity: .4; cursor: not-allowed; }    .gp-pager .gp-page-info { font-size: 12px; color: #888; }    .gp-page-jump { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #666; }    .gp-page-jump input { width: 56px; padding: 4px 6px; border: 1px solid var(--border, #ddd);      border-radius: 5px; font: inherit; color: inherit; text-align: center; }    .gp-page-jump input:focus { outline: none; border-color: var(--brand, #2f6fed); }  </style></head><body>  <header id="page-header">    <div class="gp-head-row"><h1>产品档案</h1><a class="gp-home-btn" href="./index.html">← 返回主页</a></div>  </header>  <div class="gp-toolbar" id="gp-toolbar">    <input id="gp-search" type="search" placeholder="搜索游戏名 / 开发商…" autocomplete="off" />    <button id="gp-clear" class="st-btn">清空</button>    <span class="gp-count" id="gp-count"></span><button id="gp-new" class="st-btn">+ 新建游戏</button>    <select id="gp-filter" class="st-btn" title="筛选">      <option value="">全部</option>      <option value="high">高价值</option>      <option value="mid">中价值</option>      <option value="low">低价值</option>      <option value="abandoned">放弃</option>    </select>    <span id="gp-platform-filter" class="gp-platform-filter" title="按榜单平台筛选">      <button data-plat="all" class="active">全部平台</button>      <button data-plat="wx">💬微信</button>      <button data-plat="douyin">🎵抖音</button>      <button data-plat="ios">🍎iOS</button>      <button data-plat="android">🤖安卓</button>      <button data-plat="taptap">📅TapTap</button>    </span>    <button id="gp-fav" class="st-btn">❤ 我的收藏</button>  </div>  <section class="panel">    <div id="gp-loading" class="pub-loading">正在加载产品列表…</div>    <div id="gp-list" class="gp-list"></div>    <div class="gp-form" id="gp-form" style="display:none">      <div id="gp-view" style="display:none">        <div class="gp-actions" style="margin-top:0">          <button type="button" class="gp-back" id="gp-view-back">← 返回列表</button>          <div class="gp-view-name-wrap"><h2 class="gp-view-name" style="margin:0">—</h2><span class="gp-board-tag" id="gp-view-board" style="display:none"></span></div>        </div>        <dl class="gp-view-fields" style="margin-top:16px"></dl>        <label>截图</label>        <div class="gp-shots" id="gp-view-shots"></div>        <div class="gp-actions">          <button id="gp-edit-btn" class="gp-save" type="button">编辑档案</button>        </div>      </div>      <div id="gp-edit-mode" style="display:none">        <div class="gp-actions" style="margin-top:0">          <button type="button" class="gp-back" id="gp-back">← 返回列表</button>          <div class="gp-view-name-wrap"><h2 id="gp-edit-title" style="margin:0">—</h2><span class="gp-board-tag" id="gp-edit-board" style="display:none"></span></div>        </div>      <label>游戏名称 <span class="gp-hint">(新建时可修改)</span></label>      <input id="gp-edit-name" type="text" style="display:none" />      <label>开发商</label>      <input id="gp-developer" type="text" placeholder="例如：XX网络科技" />      <label>玩法价值</label>      <div class="gp-value-pick" id="gp-value-pick">        <label><input type="radio" name="gp-value" value="high" /> <span class="gp-val high">高价值</span></label>        <label><input type="radio" name="gp-value" value="mid" /> <span class="gp-val mid">中价值</span></label>        <label><input type="radio" name="gp-value" value="low" /> <span class="gp-val low">低价值</span></label>        <label><input type="radio" name="gp-value" value="abandoned" /> <span class="gp-val abandoned">放弃</span></label>      </div>      <label id="gp-abandon-reason-label" style="display:none">放弃理由 <span class="gp-hint">(选择放弃时显示)</span></label>      <input id="gp-abandon-reason" type="text" placeholder="为什么放弃？如：玩法与现有产品重复、敲门产品、资金难以支撑等" style="display:none" />      <label>玩法描述 <span class="gp-hint">(Markdown)</span></label>      <div class="md-editor">        <div class="md-toolbar" id="gp-md-toolbar">          <button type="button" data-wrap="**" title="加粗"><b>B</b></button>          <button type="button" data-wrap="*" title="斜体"><i>I</i></button>          <button type="button" data-md="### " title="标题">H</button>          <button type="button" data-md="- " title="无序列表">•</button>          <button type="button" data-md="1. " title="有序列表">1.</button>          <button type="button" data-md="> " title="引用">❝</button>          <button type="button" data-md="`code`" title="行内代码">&lt;/&gt;</button>          <button type="button" data-md-block="```" title="代码块">≡</button>          <button type="button" data-md="[链接文字](https://)" title="链接">🔗</button>          <button type="button" data-md="![图片说明](https://)" title="图片">🖼</button>          <button type="button" data-md="---" title="分割线">—</button>          <span class="md-spacer"></span>          <button type="button" class="md-tab active" data-mode="write">编辑</button>          <button type="button" class="md-tab" data-mode="preview">预览</button>        </div>        <textarea id="gp-desc" placeholder="支持 Markdown：标题、加粗、列表、链接…"></textarea>        <div class="md-preview" id="gp-desc-preview" style="display:none"></div>      </div>      <label>标签 <span class="gp-hint">(逗号分隔)</span></label>      <input id="gp-tags" type="text" placeholder="休闲, 模拟经营, 消除" />      <label>备注</label>      <textarea id="gp-notes" placeholder="内部备注…"></textarea>      <label>截图</label>      <div class="gp-shots" id="gp-shots"></div>      <div class="gp-upload">        <input id="gp-file" type="file" accept="image/*" multiple />        <span class="gp-hint">选择图片后点击「保存档案」一并上传</span>      </div>      <div class="gp-actions">        <button id="gp-save" class="gp-save" type="button">保存档案</button>        <span class="gp-status" id="gp-status"></span>      </div>      </div>    </div>  <div cl
